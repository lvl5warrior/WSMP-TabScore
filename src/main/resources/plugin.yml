name: WSMP-TabScoreboard
version: '1.0.0'
main: com.warriorssmp.tabscoreboard.TabScoreboardPlugin
api-version: '26.2'
author: WarriorsSMP
description: Configurable scoreboard sidebar and tablist prefixes/header/footer, pulling live stats from other WSMP plugins via PlaceholderAPI.
softdepend: [PlaceholderAPI, WSMP-Duels]

commands:
  tabscoreboard:
    description: Live-edit and manage the scoreboard/tablist config
    usage: /tabscoreboard <list|reload|set|clear|get|line|addline|removeline|worldheader|removeworldheader>
    aliases: [wsmptab, tsb]
    permission: wsmptabscoreboard.admin

permissions:
  wsmptabscoreboard.admin:
    description: Access to view and edit the scoreboard/tablist config
    default: op
